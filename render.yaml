# Blueprint Render cho API v2 (deploy v1 — ADR-0024, spec 2026-08-19-deploy-v1).
#
# MỘT service duy nhất: Web Service Docker chạy API + worker INLINE
# (WORKER_INLINE=true) — Render free không có Background Worker. Nếu sau này
# nâng plan: thêm service worker thứ hai dùng CÙNG image với
# dockerCommand `node dist/worker.js` và đặt WORKER_INLINE=false ở service này.
#
# Env `sync: false` = khai báo tên, GIÁ TRỊ điền trên dashboard (hoặc import
# file .env — apps/api/.env.production là bản mẫu để user fill, gitignored).
services:
  - type: web
    name: nexora-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: apps/api/Dockerfile
    # Build context là ROOT repo — Dockerfile copy pnpm-workspace + libs/shared.
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3001'
      - key: WORKER_INLINE
        value: 'true'
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: TRUSTED_ORIGINS
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
      - key: NEWSLETTER_UNSUBSCRIBE_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # W4 E6: secret svix của webhook Resend (whsec_…) — thiếu là endpoint
      # /api/webhooks/resend 503 và suppression không được ghi.
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Thư mục gốc trên Cloudinary (bỏ trống = `tourism`). Nó còn là TIỀN TỐ SỞ HỮU của
      # mọi ảnh admin đã tải (ảnh tour, ảnh bìa bài viết — apps/api/src/lib/upload-signing.ts):
      # chỉ đặt MỘT lần, trước khi có ảnh. Đổi về sau là mồ côi ảnh cũ — chúng hiện thành
      # "Catalogue photo" và gỡ đi thì không còn vào hàng dọn, file nằm lại trên Cloudinary.
      - key: CLOUDINARY_UPLOAD_FOLDER
        sync: false
      # Đăng nhập Google: thiếu một trong hai → provider google không đăng ký,
      # email/password vẫn chạy.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # ── ADR-0024 AMEND 2 (W2): khai ĐỦ KEY để dashboard hiện ô tường minh
      # thay vì biến tàng hình — ô bỏ trống là chuỗi rỗng, parseEnv strip về
      # default (TRUST_PROXY dải nội bộ · GC tắt · thuế/phí 0 · CORS_ORIGINS
      # rơi về TRUSTED_ORIGINS); điền là quyết định có chủ đích. ──
      - key: TRUST_PROXY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Định dạng phải ĐÚNG kiểu zod của env.ts, gõ sai là API không boot:
      # MEDIA_GC_ENABLED chỉ nhận `true`/`false` (chữ thường); GRACE_DAYS số
      # nguyên; MARGIN_TAX_RATE/PAYMENT_FEE_RATE là tỉ lệ 0..1 (0.1 = 10%, KHÔNG
      # phải "10%"); PAYMENT_FEE_FIXED số thập phân. Trần rate-limit đang
      # in-memory per-process — KHÔNG scale ngang (ADR-0024 AMEND 3).
      - key: MEDIA_GC_ENABLED
        sync: false
      # W4 R1 (ADR-0037 AMEND 2): trần đọc công khai 300/60s theo IP. Chế độ
      # `log` (mặc định khi bỏ trống — đếm và warn, KHÔNG 429) cho tới khi
      # đo được `clientIp` ở GET /health từ hai mạng khác nhau là hai IP khác
      # nhau; đo xong mới đặt `enforce`. INTERNAL_READ_KEY (≥16 ký tự, sinh:
      # openssl rand -base64 24) phải TRÙNG giá trị đặt ở Vercel web —
      # web SSR/build gửi header x-internal-read-key để được miễn trần đọc.
      - key: PUBLIC_READ_THROTTLE_MODE
        sync: false
      - key: INTERNAL_READ_KEY
        sync: false
      # W4 E8: số THÁNG giữ PII enquiry trước khi job hằng ngày anonymize
      # (số nguyên 1..120; bỏ trống = 18).
      - key: ENQUIRY_RETENTION_MONTHS
        sync: false
      - key: MEDIA_GC_GRACE_DAYS
        sync: false
      - key: MARGIN_TAX_RATE
        sync: false
      - key: PAYMENT_FEE_RATE
        sync: false
      - key: PAYMENT_FEE_FIXED
        sync: false
      # ADR-0010 AMEND 1: DSN của project Sentry kiểu Node.js. Có giá trị thì mỗi lỗi 500 của API
      # lên Sentry, chỉ kèm method và đường dẫn, không header, query hay body
      # (apps/api/src/lib/observability.ts). Phải là URL `https://…`: gõ sai là API không boot.
      # Bỏ trống = tắt, lỗi 500 chỉ nằm ở stdout của Render. Kiểm DSN: `pnpm sentry:test`.
      - key: SENTRY_DSN
        sync: false
      # P6 trợ lý AI (ADR-0050 §4): bỏ trống CHAT_ENABLED là TẮT (/api/chat trả 503, nút
      # nổi của web chỉ còn enquiry). Bật `true` thì ANTHROPIC_API_KEY bắt buộc, thiếu là
      # API không boot. CHAT_MODEL phải có dòng trong apps/api/src/modules/chat/chat-pricing.ts
      # (bỏ trống = claude-haiku-4-5). CHAT_DAILY_BUDGET_USD là trần USD mỗi ngày UTC,
      # 0.1..50, bỏ trống = 1.
      - key: CHAT_ENABLED
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHAT_MODEL
        sync: false
      - key: CHAT_DAILY_BUDGET_USD
        sync: false
