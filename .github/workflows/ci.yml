name: CI

# Chạy trên MỌI branch: trước đây chỉ `main` + pull_request, nên feature branch
# đẩy lên không được CI kiểm gì cả — chỉ biết xanh/đỏ SAU khi đã merge vào main.
# Với quy ước merge rebase+ff (không qua PR), đó là lỗ hổng thật.
on:
  push:
    branches: ['**']
  pull_request:

# Push kèm PR sẽ sinh 2 run cho cùng một ref — huỷ run cũ, giữ run mới nhất.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # Postgres cho integration test (apps/api/src/**/*.int.spec.ts, 9 file /
    # 72 test — TOÀN BỘ luồng tiền P2 + bề mặt bảo mật P3a). Trước đây
    # `test:int` chỉ là script rời trong apps/api/package.json, không nối vào
    # turbo task/CI nào — 6 vòng review lọt qua chính vì thứ này chưa từng
    # chạy trên CI. Cổng 5432 map ra host giống hệt compose.yaml ở local, vì
    # `vitest.int.global-setup.ts` nói chuyện qua TCP tới `localhost:5432`
    # (không phụ thuộc tên container Docker cụ thể).
    services:
      postgres:
        # Khớp compose.yaml — test trên major version khác với dev/deploy là
        # tự chuốc lỗi chỉ lộ ở một phía.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tourism
          POSTGRES_PASSWORD: tourism
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tourism"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # `vitest.int.config.ts` tự hard-code DATABASE_URL trỏ `tourism_test`
      # cho tiến trình test — biến này chỉ để rõ ràng/nhất quán với quy ước
      # DATABASE_URL của repo, globalSetup của test:int tự tạo db đó (idempotent)
      # rồi `prisma migrate deploy`, KHÔNG cần bước tạo db/migrate riêng ở đây.
      DATABASE_URL: postgresql://tourism:tourism@localhost:5432/tourism_test
    steps:
      - uses: actions/checkout@v4
        with:
          # docs-freshness cần lịch sử commit để đối chiếu với CHANGELOG;
          # checkout mặc định là shallow depth=1 nên `git log` sẽ rỗng.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4 # đọc packageManager từ package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # test:int chạy TRƯỚC gate — CỐ Ý, đừng đảo lại. Từ ADR-0008 (reconcile
      # admin lúc onApplicationBootstrap), 4 e2e spec trong task `test` boot cả
      # AppModule nên chạm bảng User → cần db `tourism_test` ĐÃ migrate. Cơ chế
      # tạo db + migrate duy nhất là globalSetup của test:int (idempotent, qua
      # TCP) — cho nó chạy trước là unit e2e có schema, không phải nhân đôi
      # bước tạo db/migrate trong YAML này. (CI đỏ 21→23/07 vì thiếu điều này.)
      - run: pnpm test:int

      # Build web cần API SỐNG (ADR-0016, chốt 31/07: "build với API sống +
      # settle() làm lưới" — SSG fetch catalogue lúc prerender). Thiếu khối
      # này CI đỏ ÂM THẦM từ 31/07 tới 04/08: test:int phía trên vẫn xanh,
      # rồi build web chết `fetch failed` — không ai hay vì merge kiểu
      # rebase+ff không chờ check. Postgres service tự tạo db `tourism`
      # (POSTGRES_DB mặc định theo user), tách khỏi `tourism_test` của int.
      - name: Migrate + seed db `tourism` rồi mở API nền cho build web
        env:
          DATABASE_URL: postgresql://tourism:tourism@localhost:5432/tourism
        run: |
          pnpm --filter @tourism/api exec prisma migrate deploy
          pnpm --filter @tourism/api run db:seed
          pnpm --filter @tourism/api run build
          (cd apps/api && node dist/main.js > /tmp/ci-api.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health > /dev/null && exit 0
            sleep 2
          done
          echo '::error::API không lên được trong 60s'; tail -50 /tmp/ci-api.log; exit 1

      - run: pnpm turbo run build typecheck test

      - run: pnpm lint

      # Luật 13 (docs sweep) tồn tại từ P0 mà vẫn bị bỏ qua 8 merge liên tiếp
      # ngày 19/07 — nên kiểm bằng máy thay vì trông vào trí nhớ. CHỈ chạy
      # trên main: nhánh feature đang làm dở thì CHANGELOG lạc hậu là bình
      # thường, entry viết lúc merge.
      - name: CHANGELOG còn theo kịp main không (CLAUDE.md luật 13)
        if: github.ref == 'refs/heads/main'
        run: ./scripts/docs-freshness.sh
