# Local dev stack (WSL). W6 sẽ bổ sung service api + worker.
# Chạy: docker compose up -d postgres
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tourism
      POSTGRES_PASSWORD: tourism
      POSTGRES_DB: tourism
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tourism -d tourism']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
