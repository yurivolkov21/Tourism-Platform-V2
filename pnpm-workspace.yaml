packages:
  - 'apps/*'
  - 'libs/shared/*'
  - 'libs/web/*'
  - 'libs/mobile/*'
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  prisma: true
  # sharp: Next.js image optimization (next/image) — cần build native binary.
  sharp: true

# Next 16.2.11 vừa release: pnpm supply-chain gate (minimumReleaseAge) tự loại
# trừ để cài ngay. Giữ nguyên — đúng phiên bản đã chốt.
minimumReleaseAgeExclude:
  - '@next/env@16.2.11'
  - '@next/swc-darwin-arm64@16.2.11'
  - '@next/swc-darwin-x64@16.2.11'
  - '@next/swc-linux-arm64-gnu@16.2.11'
  - '@next/swc-linux-arm64-musl@16.2.11'
  - '@next/swc-linux-x64-gnu@16.2.11'
  - '@next/swc-linux-x64-musl@16.2.11'
  - '@next/swc-win32-arm64-msvc@16.2.11'
  - '@next/swc-win32-x64-msvc@16.2.11'
  - next@16.2.11

# Vá lỗ hổng bảo mật ở dependency bắc cầu (medium: middleware bypass qua
# serveStatic). Đường đi: prisma CLI (devDep) → @prisma/dev → @hono/node-server.
# Ta không dùng Hono, và prisma là devDependency nên không vào bundle prod —
# nhưng vẫn ghim bản vá để repo sạch alert.
# Ghim trong dòng 1.x: '>=1.19.13' sẽ kéo lên 2.0.x (nhảy major) và có thể phá
# @prisma/dev vốn khai báo cho 1.x.
# 23/07 — alert Dependabot #2 (path traversal serve-static, CHỈ Windows, vá ở
# 2.0.5 không có backport 1.x): giữ nguyên ghim 1.x, alert được dismiss có ghi
# lý do — code path không chạm tới (dev-tooling, WSL/Linux, không serve-static).
overrides:
  # 27/07 — MỘT bản React cho cả workspace. `apps/web` ghim cứng 19.2.4 (khớp
  # Next 16.2.11), còn `libs/shared/ui` khai peer '^19' nên pnpm tự cài thêm
  # 19.2.7 và `@base-ui/react` bám vào bản đó → store có HAI React.
  # Next bundler tự dedupe nên dev/build không lộ ra, nhưng Vitest thì lộ ngay:
  # react-dom 19.2.4 render component gọi hook của react 19.2.7 → dispatcher
  # null, mọi component Base UI ném "Cannot read properties of null".
  # Đã đo: `resolve.dedupe` KHÔNG chữa (store cô lập của pnpm), alias trong
  # vitest.config cũng KHÔNG (Vitest externalize node_modules nên Node resolve
  # thẳng, không qua alias). Ghim ở đây là chỗ duy nhất chữa tận gốc.
  # Ghim ĐÚNG bản apps/web đang chạy — đây là hạ xuống cho khớp, KHÔNG nâng cấp.
  react: '19.2.4'
  react-dom: '19.2.4'
  '@hono/node-server': '^1.19.13'
  # Alert #6 (high, libvips CVE 2026-33327/28 + 35590/91): sharp là optional dep
  # của Next (image optimization, CÓ chạy ở prod) nhưng Next khai báo ^0.34 —
  # ép qua override lên dòng đã vá.
  sharp: '>=0.35.0'
  # Alert #5 (medium, XSS qua </style> trong stringify): Next pin CỨNG postcss
  # 8.4.31 nội bộ cho styled-jsx — override kéo mọi bản 8.x về dòng đã vá.
  postcss: '>=8.5.10'
  # 27/07 — ba alert mới (#8 #9 #10), cả ba là dependency bắc cầu.
  #
  # Alert #8 (high, CVSS 7.5, GHSA-c96f-x56v-gq3h — DDoS qua HTTP/2):
  # find-my-way là router BÊN TRONG fastify, tức nằm trên đường HTTP thật của
  # apps/api. fastify@5.10.0 khai ^9.6.0 nên tự lên 9.7.0 được, nhưng
  # @nestjs/platform-fastify@11.1.28 GHIM CỨNG 9.6.0 (bản mới nhất 11.x cũng
  # vẫn ghim 9.6.0) → phải override. Ghim trong dòng 9.x: nhảy 10.x có thể phá
  # fastify 5. Ghi chú mức độ: apps/api KHÔNG bật HTTP/2 ở đâu (đã grep
  # http2/allowHTTP1/createSecureServer = rỗng) nên lỗ hổng không với tới được
  # ở cấu hình hiện tại — vá để sạch alert và phòng khi sau này bật HTTP/2.
  find-my-way: '^9.7.0'
  # Alert #9 (moderate, GHSA-5qjj-4xww-7phc — record() làm flatten() ném lỗi
  # với tên thuộc tính kế thừa của Object): đường đi prisma CLI → @prisma/dev
  # → valibot, bị GHIM CỨNG 1.2.0 (bản @prisma/dev mới nhất 0.24.16 vẫn ghim
  # 1.2.0) → phải override. Dự án không dùng valibot (validate bằng zod), đây
  # thuần dev-tooling. Ghim trong dòng 1.x cho khỏi nhảy major.
  valibot: '^1.4.2'
  # Alert #10 (high, CVSS 7.5, GHSA-mh99-v99m-4gvg — DoS: chuỗi brace nở vô
  # hạn làm hết RAM): advisory ghi affected `<= 5.0.7`, tức CẢ dòng 2.x cũng
  # dính mà KHÔNG có backport — bản vá duy nhất là 5.0.8. Hai đường đi:
  #   minimatch@10 (shadcn/ts-morph + style-dictionary) — tự lên 5.0.8 được;
  #   minimatch@9  (@swc/cli — trình biên dịch build của apps/api) khai ^2.0.1.
  # Override này ÉP QUA major 2→5. An toàn được vì brace-expansion 5.x vẫn
  # xuất bản CJS ở `exports.require`; đã chứng minh bằng cách chạy build API
  # thật (gate:int) chứ không suy đoán. Nếu ngày nào build gãy vì dòng này:
  # gỡ nó ra và chấp nhận alert — mẫu brace ở đây do CHÍNH package.json của
  # mình viết, không phải input từ ngoài, nên không ai khai thác được.
  brace-expansion: '^5.0.8'
