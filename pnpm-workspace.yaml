packages:
  - 'apps/*'
  - 'libs/shared/*'
  - 'libs/web/*'
  - 'libs/mobile/*'
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  # esbuild: dep bắc cầu của react-email (CLI — không dùng); binary đến từ
  # optional dep @esbuild/linux-x64 nên install script không cần chạy.
  esbuild: false
  prisma: true
  # sharp: Next.js image optimization (next/image) — cần build native binary.
  sharp: true

# Next 16.2.11 vừa release: pnpm supply-chain gate (minimumReleaseAge) tự loại
# trừ để cài ngay. Giữ nguyên — đúng phiên bản đã chốt.
minimumReleaseAgeExclude:
  - '@next/env@16.2.11'
  - '@next/swc-darwin-arm64@16.2.11'
  - '@next/swc-darwin-x64@16.2.11'
  - '@next/swc-linux-arm64-gnu@16.2.11'
  - '@next/swc-linux-arm64-musl@16.2.11'
  - '@next/swc-linux-x64-gnu@16.2.11'
  - '@next/swc-linux-x64-musl@16.2.11'
  - '@next/swc-win32-arm64-msvc@16.2.11'
  - '@next/swc-win32-x64-msvc@16.2.11'
  - next@16.2.11
  # Next 16.3.0 GA 03/08/2026 — nâng ngay trong cửa sổ trước freeze (hỗ trợ
  # TS7 chính thức cho next build); cùng nếp exclude như đợt 16.2.11.
  - '@next/env@16.3.0'
  - '@next/swc-darwin-arm64@16.3.0'
  - '@next/swc-darwin-x64@16.3.0'
  - '@next/swc-linux-arm64-gnu@16.3.0'
  - '@next/swc-linux-arm64-musl@16.3.0'
  - '@next/swc-linux-x64-gnu@16.3.0'
  - '@next/swc-linux-x64-musl@16.3.0'
  - '@next/swc-win32-arm64-msvc@16.3.0'
  - '@next/swc-win32-x64-msvc@16.3.0'
  - next@16.3.0
  - postcss@8.5.23
  - undici@7.29.0
  - fast-uri@3.1.7 || 4.1.3
  - qs@6.16.0
  # Đợt vá 03/09: fastify 5.12.1 + fast-uri 4.1.3 xuất bản cùng ngày với
  # advisory — cửa sổ minimumReleaseAge sẽ chặn, exclude như các đợt trước.
  - fastify@5.12.1
  - ip-address@10.2.1 || 10.2.2 || 10.3.1
  - hono@4.12.34
  - brace-expansion@5.0.9

# Vá lỗ hổng bảo mật ở dependency bắc cầu (medium: middleware bypass qua
# serveStatic). Đường đi: prisma CLI (devDep) → @prisma/dev → @hono/node-server.
# Ta không dùng Hono, và prisma là devDependency nên không vào bundle prod —
# nhưng vẫn ghim bản vá để repo sạch alert.
# Ghim trong dòng 1.x: '>=1.19.13' sẽ kéo lên 2.0.x (nhảy major) và có thể phá
# @prisma/dev vốn khai báo cho 1.x.
# 23/07 — alert Dependabot #2 (path traversal serve-static, CHỈ Windows, vá ở
# 2.0.5 không có backport 1.x): giữ nguyên ghim 1.x, alert được dismiss có ghi
# lý do — code path không chạm tới (dev-tooling, WSL/Linux, không serve-static).
overrides:
  # 27/07 — MỘT bản React cho cả workspace. `apps/web` ghim cứng 19.2.4 (khớp
  # Next 16.2.11), còn `libs/shared/ui` khai peer '^19' nên pnpm tự cài thêm
  # 19.2.7 và `@base-ui/react` bám vào bản đó → store có HAI React.
  # Next bundler tự dedupe nên dev/build không lộ ra, nhưng Vitest thì lộ ngay:
  # react-dom 19.2.4 render component gọi hook của react 19.2.7 → dispatcher
  # null, mọi component Base UI ném "Cannot read properties of null".
  # Đã đo: `resolve.dedupe` KHÔNG chữa (store cô lập của pnpm), alias trong
  # vitest.config cũng KHÔNG (Vitest externalize node_modules nên Node resolve
  # thẳng, không qua alias). Ghim ở đây là chỗ duy nhất chữa tận gốc.
  # Ghim ĐÚNG bản apps/web đang chạy — đây là hạ xuống cho khớp, KHÔNG nâng cấp.
  react: '19.2.4'
  react-dom: '19.2.4'
  '@hono/node-server': '^1.19.13'
  # Alert #6 (high, libvips CVE 2026-33327/28 + 35590/91): sharp là optional dep
  # của Next (image optimization, CÓ chạy ở prod) nhưng Next khai báo ^0.34 —
  # ép qua override lên dòng đã vá.
  sharp: '>=0.35.0'
  # Alert #5 (medium, XSS qua </style> trong stringify): Next pin CỨNG postcss
  # 8.4.31 nội bộ cho styled-jsx — override kéo mọi bản 8.x về dòng đã vá.
  postcss: '>=8.5.10'
  # 27/07 — ba alert mới (#8 #9 #10), cả ba là dependency bắc cầu.
  #
  # Alert #8 (high, CVSS 7.5, GHSA-c96f-x56v-gq3h — DDoS qua HTTP/2):
  # find-my-way là router BÊN TRONG fastify, tức nằm trên đường HTTP thật của
  # apps/api. fastify@5.10.0 khai ^9.6.0 nên tự lên 9.7.0 được, nhưng
  # @nestjs/platform-fastify@11.1.28 GHIM CỨNG 9.6.0 (bản mới nhất 11.x cũng
  # vẫn ghim 9.6.0) → phải override. Ghim trong dòng 9.x: nhảy 10.x có thể phá
  # fastify 5. Ghi chú mức độ: apps/api KHÔNG bật HTTP/2 ở đâu (đã grep
  # http2/allowHTTP1/createSecureServer = rỗng) nên lỗ hổng không với tới được
  # ở cấu hình hiện tại — vá để sạch alert và phòng khi sau này bật HTTP/2.
  find-my-way: '^9.7.0'
  # Alert #9 (moderate, GHSA-5qjj-4xww-7phc — record() làm flatten() ném lỗi
  # với tên thuộc tính kế thừa của Object): đường đi prisma CLI → @prisma/dev
  # → valibot, bị GHIM CỨNG 1.2.0 (bản @prisma/dev mới nhất 0.24.16 vẫn ghim
  # 1.2.0) → phải override. Dự án không dùng valibot (validate bằng zod), đây
  # thuần dev-tooling. Ghim trong dòng 1.x cho khỏi nhảy major.
  valibot: '^1.4.2'
  # Alert #10 (high, CVSS 7.5, GHSA-mh99-v99m-4gvg — DoS: chuỗi brace nở vô
  # hạn làm hết RAM): advisory ghi affected `<= 5.0.7`, tức CẢ dòng 2.x cũng
  # dính mà KHÔNG có backport — bản vá duy nhất là 5.0.8. Hai đường đi:
  #   minimatch@10 (shadcn/ts-morph + style-dictionary) — tự lên 5.0.8 được;
  #   minimatch@9  (@swc/cli — trình biên dịch build của apps/api) khai ^2.0.1.
  # Override này ÉP QUA major 2→5. An toàn được vì brace-expansion 5.x vẫn
  # xuất bản CJS ở `exports.require`; đã chứng minh bằng cách chạy build API
  # thật (gate:int) chứ không suy đoán. Nếu ngày nào build gãy vì dòng này:
  # gỡ nó ra và chấp nhận alert — mẫu brace ở đây do CHÍNH package.json của
  # mình viết, không phải input từ ngoài, nên không ai khai thác được.
  brace-expansion: '^5.0.9'
  # Đợt vá Dependabot 03/08 (13 alert + 1 pnpm audit thấy thêm) — sinh bởi
  # `pnpm audit --fix=override`, scoped theo đúng dải dính lỗ hổng nên không
  # ghim vĩnh viễn các bản sau. Toàn bộ là dep bắc cầu (fastify→fast-uri ·
  # shadcn/MCP-sdk→ip-address+hono; @hono/node-server GIỮ ghim 1.x theo quyết định 23/07 đã dismiss · jsdom/vitest/dotenvx→undici · tooling→
  # postcss). Chi tiết: CHANGELOG 03/08.
  # 03/09: `pnpm audit` (DB npm) ghi dòng 3.x dính CÙNG bốn GHSA (<3.1.6) dù
  # Dependabot chỉ liệt kê 4.x — vá cả hai dòng, đừng tin một nguồn.
  fast-uri@>=3.0.0 <3.1.6: ^3.1.6
  # 03/09 — bốn alert fast-uri mới (#32–#35, high: host confusion / SSRF qua
  # chuẩn hoá IPv6 và percent-decoding), CVE công bố 02/09 SAU đợt vá cùng
  # ngày; dải dính nới tới <4.1.3. Đường kéo: fastify → fast-json-stringify
  # (^4.0.0). Dòng 3.x giữ nguyên: advisory chỉ ghi >=4.0.0.
  fast-uri@>=4.0.0 <4.1.3: ^4.1.3
  # 03/09 — qs (GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g, moderate) `pnpm audit`
  # thấy trước khi Dependabot kịp mở alert; đường kéo @orpc/nest → express →
  # qs/body-parser. API không dùng express (adapter Fastify) nên qs là code
  # chết trong store, vá để sạch audit.
  qs@<6.16.0: ^6.16.0
  hono@<4.12.34: ^4.12.34
  ip-address@<=10.3.0: ^10.3.1
  ip-address@>=10.1.1 <=10.2.0: ^10.2.1
  ip-address@>=10.1.1 <=10.2.1: ^10.2.2
  postcss@<=8.5.22: ^8.5.23
  undici@>=7.0.0 <7.29.0: ^7.29.0
  # Đợt vá Dependabot 11/08 (2 alert high) — cả hai là dep bắc cầu, scoped
  # theo dải dính như hai batch trên.
  # nanoid < 3.3.17: kéo về qua postcss@8.5.25 (dùng nanoid sinh source-map
  # id) — đường vào apps/web (@tailwindcss/postcss, next, better-auth peer),
  # apps/api (better-auth peer) và libs/shared/ui (shadcn). Bản trước override
  # là 3.3.16, ghim trong dòng 3.x vì mọi parent đang thấy đều là CJS, không
  # có bản 5.x nào trong cây (đã kiểm `pnpm why nanoid` — chỉ 1 version).
  nanoid@<3.3.17: ^3.3.17
  # js-yaml >=4.0.0 <4.3.1: kéo về qua cosmiconfig (shadcn CLI) →
  # libs/shared/ui. Bản trước override là 4.3.0.
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  # Đợt vá Dependabot 18/08 (1 alert high) — dep bắc cầu, scoped như các batch trên.
  # deepmerge-ts < 8.0.0 (GHSA-ggr8-5vv4-36mx — stack exhaustion khi merge object
  # đệ quy): đường vào là prisma CLI → @prisma/config, bị GHIM CỨNG '7.1.5' (không
  # phải range) nên không tự lên được → phải override, và override này ÉP QUA
  # major 7→8.
  # An toàn được vì bề mặt API dùng thực tế RẤT hẹp: @prisma/config chỉ lấy đúng
  # named export `deepmerge` rồi truyền làm `merger` cho c12 (đã đọc dist/index.js,
  # 3 lần nhắc đều là một chỗ gọi đó) — không đụng tới phần types/record mà v8 đổi.
  # Chứng minh bằng CHẠY THẬT chứ không suy đoán: prisma generate + migrate status
  # + gate:int (build API, 180 int test dùng Prisma) đều xanh sau khi ép.
  # Mức độ thực tế: @prisma/config chỉ chạy lúc đọc file cấu hình ở CLI/build, KHÔNG
  # nằm trên đường phục vụ request, và input là prisma.config.ts của chính mình chứ
  # không phải dữ liệu người dùng — vá để sạch alert, không phải vì đang bị với tới.
  # Nếu ngày nào prisma CLI gãy vì dòng này: gỡ ra và chấp nhận alert.
  deepmerge-ts@<8.0.0: ^8.0.1
  # 03/09 — bốn alert fastify (#30 #31 #36 #37, moderate; CVE công bố 02/09
  # 15:13 UTC, SAU đợt vá 13:04 cùng ngày): X-Forwarded-* spoofing dưới
  # trustProxy dạng hop-count — ĐÚNG dạng API đang dùng (`trustProxy: 1`,
  # bootstrap.ts) nên request.ip cho rate limit giả mạo được; và schema
  # validation bypass với body schema primitive (không áp dụng: API validate
  # bằng zod/oRPC, không dùng fastify schema). Vá duy nhất là 5.12.1.
  # Vì sao override thay vì chỉ nâng dep trực tiếp: @nestjs/platform-fastify
  # GHIM CỨNG fastify (11.1.28 → 5.10.0, 11.2.3 mới nhất → 5.11.3, vẫn
  # dính), nên nâng `apps/api` lên 5.12.1 mà không override là HAI fastify
  # trong store — adapter Nest chạy bản cũ. Scoped: bản sau 5.12.1 tự do.
  fastify@>=5.0.0 <5.12.1: 5.12.1
  # 02/09 — ba alert mới (#27 #28 #29, đều high), đều là dependency bắc cầu
  # KHÔNG nằm trên đường phục vụ request; vá theo cùng nếp scoped override
  # (chỉ áp trong dải dính lỗ hổng, không ghim chết bản sau).
  #
  # Alert #28 #29 (browserslist ≤4.28.6 — prototype write qua
  # browserslist-stats.json lạ, tăng bộ nhớ không giới hạn): kéo vào qua
  # shadcn CLI → @babel/core → @babel/helper-compilation-targets (^4.24.0).
  # Chỉ chạy lúc gõ `shadcn add` trên máy dev; Next đóng gói browserslist
  # riêng nên bundle web/admin không dính. Nâng shadcn 4.20 không đảm bảo
  # re-resolve (khai ^4.26.2) → override cho chắc.
  browserslist@<4.28.7: ^4.28.7
  # Alert #27 (mysql2 <3.22.0 — downgrade auth plugin lộ mật khẩu plaintext):
  # prisma CLI 7.8.0 GHIM CỨNG `mysql2: 3.15.3` (7.9.x, 7.10.0 vẫn vậy; 8.0
  # còn rc, sát freeze 15/10) dù DB là Postgres — parseEnv từ chối `mysql://`
  # (có test), không file nào require mysql2. Code chết trong node_modules,
  # override để sạch alert; better-auth chỉ khai peer optional ^3.0.0 nên
  # 3.22+ vẫn thoả.
  mysql2@<3.22.0: ^3.22.0
