packages:
  - 'apps/*'
  - 'libs/shared/*'
  - 'libs/web/*'
  - 'libs/mobile/*'
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  prisma: true
  # sharp: Next.js image optimization (next/image) — cần build native binary.
  sharp: true

# Next 16.2.11 vừa release: pnpm supply-chain gate (minimumReleaseAge) tự loại
# trừ để cài ngay. Giữ nguyên — đúng phiên bản đã chốt.
minimumReleaseAgeExclude:
  - '@next/env@16.2.11'
  - '@next/swc-darwin-arm64@16.2.11'
  - '@next/swc-darwin-x64@16.2.11'
  - '@next/swc-linux-arm64-gnu@16.2.11'
  - '@next/swc-linux-arm64-musl@16.2.11'
  - '@next/swc-linux-x64-gnu@16.2.11'
  - '@next/swc-linux-x64-musl@16.2.11'
  - '@next/swc-win32-arm64-msvc@16.2.11'
  - '@next/swc-win32-x64-msvc@16.2.11'
  - next@16.2.11

# Vá lỗ hổng bảo mật ở dependency bắc cầu (medium: middleware bypass qua
# serveStatic). Đường đi: prisma CLI (devDep) → @prisma/dev → @hono/node-server.
# Ta không dùng Hono, và prisma là devDependency nên không vào bundle prod —
# nhưng vẫn ghim bản vá để repo sạch alert.
# Ghim trong dòng 1.x: '>=1.19.13' sẽ kéo lên 2.0.x (nhảy major) và có thể phá
# @prisma/dev vốn khai báo cho 1.x.
# 23/07 — alert Dependabot #2 (path traversal serve-static, CHỈ Windows, vá ở
# 2.0.5 không có backport 1.x): giữ nguyên ghim 1.x, alert được dismiss có ghi
# lý do — code path không chạm tới (dev-tooling, WSL/Linux, không serve-static).
overrides:
  '@hono/node-server': '^1.19.13'
  # Alert #6 (high, libvips CVE 2026-33327/28 + 35590/91): sharp là optional dep
  # của Next (image optimization, CÓ chạy ở prod) nhưng Next khai báo ^0.34 —
  # ép qua override lên dòng đã vá.
  sharp: '>=0.35.0'
  # Alert #5 (medium, XSS qua </style> trong stringify): Next pin CỨNG postcss
  # 8.4.31 nội bộ cho styled-jsx — override kéo mọi bản 8.x về dòng đã vá.
  postcss: '>=8.5.10'
